<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#140814" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Raspe o cartão e descubra uma surpresa." />
    <meta property="og:title" content="Feliz Aniversário" />
    <meta property="og:description" content="Raspe o cartão e descubra uma surpresa." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gio.zurmely.com" />
    <title>Feliz Aniversário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,560;1,9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23140814'/%3E%3Cpath d='M16 7l1.4 4.2H22l-3.6 2.6 1.4 4.2L16 15.4 12.2 18l1.4-4.2L10 11.2h4.6z' fill='%23f4d58d'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <canvas id="sparkles" class="sparkles"></canvas>
    </div>

    <main class="stage">
      <header class="intro">
        <p class="eyebrow">um cartão especial</p>
        <h1 class="page-title">Raspe para revelar</h1>
      </header>

      <section class="card-wrap">
        <div class="card" id="card">
          <div class="card-frame" aria-hidden="true"></div>
          <div class="prize" id="prize">
            <p class="prize-kicker">pra você</p>
            <p class="prize-title">Feliz<br />Aniversário</p>
            <div class="prize-mark">✦</div>
            <p class="prize-note">que este ano brilhe inteiro</p>
          </div>
          <canvas id="foil" class="foil" aria-label="Camada para raspar"></canvas>
          <div class="foil-hint" id="foilHint">
            <span>RASPE AQUI</span>
          </div>
        </div>
      </section>

      <p class="hint" id="hint">Use o dedo para raspar o dourado</p>
      <button class="reveal-fallback" id="revealBtn" type="button">
        Revelar sem raspar
      </button>
    </main>

    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
    <script src="app.js"></script>
  </body>
</html>
